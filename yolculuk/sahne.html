    const cr = vx * dy - vy * dx, sd = clamp(cr / .12, -1, 1), bend = .12 + .2 * Math.min(1, Math.abs(cr) * 1.5);
    const len = TLEN(t) / K, wd = len * .095 + .5 / K;
    dust.set(pos, [dx, dy], [-dy * -sd, dx * -sd], len, wd, bend);
    ion.set(pos, [dx, dy], [0, 0], len * 1.12, wd * .3, 0);
    trail.u.uShow.value.set(0, s - hs * .5, 0, 2.5); trail.u.uOp.value = lerp(.62, .8, draw); trail.u.uW.value = lerp(1.3, 1.5, draw);
    aheadU.uShow.value.set(s + hs * .6, 1e9, 4, 0); aheadU.uOp.value = .7 * sstep(TC - .2, TC + 1.4, t); ahead.visible = aheadU.uOp.value > .01;
    aheadU.uDash.value.z = -time * .15;

    // the '50+' beside the belt
    const tagA = .95 * sstep(.55, 1, RES(3, t)) * (1 - sstep(TS - 1.6, TS - .4, t));
    if (tagA > .01) { onCirc(tmp, S4.c, R4 * 1.14, PL4, .12); tmp.sub(camC); const x = W / 2 + tmp.dot(camRight) * K, y = H / 2 - tmp.dot(camUp) * K;
      tagEl.style.transform = 'translate(' + (x - 30).toFixed(1) + 'px,' + (y - 28).toFixed(1) + 'px)'; }
    tagEl.style.opacity = tagA.toFixed(3);

    // the controls make way for the comet: where its head passes beneath the stop map or a button, that control fades back so
    // the comet stays in sight, and comes back once it has passed (the route is set by the swings, so on a narrow screen it can
    // enter the picture where the map is)
    tmp.copy(pos).sub(camC); const hx = W / 2 + tmp.dot(camRight) * K, hy = H / 2 - tmp.dot(camUp) * K;
    YIELD.forEach((y) => {
      const q = y.r, o = lerp(.2, 1, sstep(6, 40, Math.hypot(Math.max(q[0] - hx, 0, hx - q[2]), Math.max(q[1] - hy, 0, hy - q[3]))));
      const v = o < .995 ? o.toFixed(2) : '';
      if (v !== y.v) { y.v = v; y.el.style.opacity = v; }
    });

    // captions keep a calm ground: the foot of the picture dissolves into the field
    let capAmt = 0; for (let i = 0; i < CAPT.length; i++) capAmt = Math.max(capAmt, sstep(CAPT[i][0] - 1, CAPT[i][0] + .5, t) * (1 - sstep(CAPT[i][1] - .3, CAPT[i][1] + 1, t)));
    // (on wide screens only its left part, as far as the widest caption line reaches)
    G.uFoot.value.set(lerp(lerp(.41, .42, r.wide), .35, draw), lerp(.2, .1, r.wide), lerp(.55, .92, capAmt), r.wide > .5 ? (INCE.yatay ? Math.max(.36, capR / W - .05) : .36) : 0);

    chrome(t);
    renderer.render(scene, camera);
    first = false;
  }
  function loop(now) { frame(now, false); requestAnimationFrame(loop); }
  setPlaying(!reduce);
  requestAnimationFrame(loop);

  // Jump straight to a moment (used for checking frames).
  window.__seek = function (t) { adaptive = false; setPlaying(false); glide = null; hold = 0; T0 = t; frame(performance.now(), true); };
  // The film's clock, for the same purpose: its length, the four stops (a approach, p problem, s solution, e end), the sun, the close,
  // the caption windows and the moments the comet passes closest to the four planets and the sun.
  window.__film = { len: TEND, stops: ST, sun: TS, close: TC, capt: CAPT, swing: TPK };
})();
