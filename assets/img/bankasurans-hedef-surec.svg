"/><circle class="bp-pin" cx="1215" cy="564" r="9"/><text class="bp-pint" x="1215" y="568" text-anchor="middle">5</text><text class="bp-nl" x="1228" y="568">Üretim verisi</text><path class="bp-gw" d="M1116 341 L1134 359 L1116 377 L1098 359 Z"/><path class="bp-gwm" d="M1110 353 L1122 365 M1122 353 L1110 365"/><text class="bp-sm" text-anchor="middle"><tspan x="1116" y="396">Poliçe?</tspan></text><polyline class="bp-sf" points="1080,359 1098,359" marker-end="url(#bpb-sf)"/><polyline class="bp-sf" points="1116,341 1116,266" marker-end="url(#bpb-sf)"/><text class="bp-fl" x="1122" y="329" text-anchor="start">Hayır</text><rect class="bp-task" x="1054" y="216" width="124" height="50" rx="9"/><text class="bp-tx" text-anchor="middle"><tspan x="1116" y="231">Poliçe yoksa teklifi</tspan><tspan x="1116" y="245">iadeye işaretle,</tspan><tspan x="1116" y="259">tutarı iade et</tspan></text><polyline class="bp-sf" points="1116,216 1116,135" marker-end="url(#bpb-sf)"/><circle class="bp-ev bp-end" cx="1116" cy="123" r="12"/><rect class="bp-env" x="1110" y="119" width="12" height="8" rx="1"/><path class="bp-env-l" d="M1110 119 L1116 124 L1122 119"/><polyline class="bp-mf bp-nf" points="1116,111 1116,48" marker-start="url(#bpb-ns)" marker-end="url(#bpb-ne)"/><circle class="bp-pin" cx="1131" cy="88" r="9"/><text class="bp-pint" x="1131" y="92" text-anchor="middle">8</text><text class="bp-nl" x="1144" y="92">İade bilgisi</text><polyline class="bp-sf" points="1134,359 1180,359" marker-end="url(#bpb-sf)"/><text class="bp-fl" x="1138" y="353" text-anchor="start">Evet</text><path class="bp-gw" d="M1198 341 L1216 359 L1198 377 L1180 359 Z"/><path class="bp-gwm" d="M1198 351 V367 M1190 359 H1206"/><polyline class="bp-sf" points="1198,341 1198,123 1228,123" marker-end="url(#bpb-sf)"/><rect class="bp-task" x="1228" y="98" width="124" height="50" rx="9"/><text class="bp-tx" text-anchor="middle"><tspan x="1290" y="120">Belgeyi ilet,</tspan><tspan x="1290" y="134">kısa mesaj gönder</tspan></text><ci