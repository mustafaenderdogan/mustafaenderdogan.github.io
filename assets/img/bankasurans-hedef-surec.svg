.bp-env { fill: #1D4F91; }
.bp-env-l { fill: none; stroke: #FFFFFF; stroke-width: 1; }</style><rect width="1424" height="624" fill="#FFFFFF"/><title id="bpb-t">Hedef süreç 2a: teklif, tahsilat, poliçe ve bildirimler; olumsuz senaryolar dahil</title><desc id="bpb-d">BPMN diyagramı. Üstte müşteri, altta SBM kapalı havuzu; numaralı mavi oklar bildirimlerdir. 1: banka müşteriyi bilgilendirir, müşterinin talimatını ve açık talebini alır; teklif ancak bundan sonra istenir. Entegrasyon katmanı POST /teklifler ile yalnız gerekli müşteri alanlarını sigorta şirketine iletir, sigorta şirketi teklifi hesaplar. Teklif oluşmazsa akış 3 numaralı ret bildirimiyle biter. Teklif ve bilgilendirme müşteriye sunulur (2); kabul edilmezse teklif kapanır. Kabul edilirse banka primi tahsil eder; tahsilat alınamazsa akış biter, teklif geçerlilik süresi içinde yeniden denenebilir. Tahsilat alınırsa entegrasyon katmanı tahsilatı teklifin üzerine yazar. Ardından POST /policeler tahsilat referansı ve Idempotency-Key ile çağrılır; sigorta şirketi SBM&#x27;den referans numarası alarak poliçeyi üretir (4) ve üretim verisini SBM&#x27;ye eş zamanlı bildirir (5). Poliçe oluşmazsa banka teklifi iade için işaretler, tutarı iade eder ve müşteriye iade bilgisini gönderir (8). Poliçe oluşursa paralel olarak müşteriye poliçe belgesi (7) ve haklarına ilişkin kısa mesaj (6) gider, POLICE_OLUSTU olayı Kafka&#x27;ya yayınlanır; CRM, komisyon ve raporlama güncellenir.</desc><defs><marker id="bpb-sf" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5565"/></marker><marker id="bpb-me" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9.5,5 L1,9 z" fill="#FFFFFF" stroke="#8A94A3" stroke-width="1.2"/></marker><marker id="bpb-ms" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="3.4" fill="#FFFFFF" stroke="#8A94A3" stroke-width="1.2"/></marker><marker id="bpb-ne" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9.5,5 L1,9 z" fill="#FFFFFF" stroke="#1D4F91" stroke-width="1.3"/></marker><marker id="bpb-ns" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="3.4" fill="#FFFFFF" stroke="#1D4F91" stroke-width="1.3"/></marker></defs><rect class="bp-pool" x="8" y="8" width="1408" height="40"/><text class="bp-pn" text-anchor="middle" x="712" y="32">MÜŞTERİ</text><rect class="bp-pool" x="8" y="64" width="1408" height="354"/><rect class="bp-lane" x="34" y="64" width="1382" height="118"/><line class="bp-sep" x1="128" y1="64" x2="128" y2="182"/><text class="bp-ln" text-anchor="middle"><tspan x="81" y="127">Banka kanalı</tspan></text><rect class="bp-lane alt" x="34" y="182" width="1382" height="118"/><line class="bp-sep" x1="128" y1="182" x2="128" y2="300"/><text class="bp-ln" text-anchor="middle"><tspan x="81" y="245">Banka sistemi</tspan></text><rect class="bp-lane" x="34" y="300" width="1382" height="118"/><line class="bp-sep" x1="128" y1="300" x2="128" y2="418"/><text class="bp-ln" text-anchor="middle"><tspan x="81" y="355.5">Entegrasyon</tspan><tspan x="81" y="370.5">katmanı</tspan></text><line class="bp-sep" x1="34" y1="64" x2="34" y2="418"/><text class="bp-pn" text-anchor="middle" transform="translate(25 241) rotate(-90)">BANKA</text><rect class="bp-pool" x="8" y="442" width="1408" height="110"/><rect class="bp-lane" x="34" y="442" width="1382" height="110"/><line class="bp-sep" x1="128" y1="442" x2="128" y2="552"/><line class="bp-sep" x1="34" y1="442" x2="34" y2="552"/><text class="bp-ln" text-anchor="middle"><tspan x="81" y="493.5">Anlaşmalı</tspan><tspan x="81" y="508.5">sigorta şirketi</tspan></text><text class="bp-pn" text-anchor="middle" transform="translate(25 497) rotate(-90)">SİGORTA</text><rect class="bp-pool" x="8" y="576" width="1408" height="40"/><text class="bp-pn" text-anchor="middle" x="712" y="600">SBM · SİGORTA BİLGİ VE GÖZETİM MERKEZİ</text><circle class="bp-ev" cx="152" cy="123" r="12"/><text class="bp-sm" text-anchor="middle"><tspan x="152" y="149">Talep</tspan></text><rect class="bp-task" x="180" y="98" width="124" height="50" rx="9"/><text class="bp-tx" text-anchor="middle"><tspan x="242" y="113">Talimatı ve açık</tspan><tspan x="242" y="127">talebi kaydet,</tspan><tspan x="242" y="141">teklif iste</tspan></text><polyline class="bp-sf" points="164,123 180,123" marker-end="url(#bpb-sf)"/><polyline class="bp-mf bp-nf" points="220,98 220,48" marker-start="url(#bpb-ns)" marker-end="url(#bpb-ne)"/><circle class="bp-pin" cx="203" cy="76" r="9"/><text class="bp-pint" x="203" y="80" text-anchor="middle">1</text><text class="bp-nl" x="190" y="80" text-anchor="end">Bilgilendirme</text><polyline class="bp-mf bp-nf" points="290,48 290,98" marker-start="url(#bpb-ns)" marker-end="url(#bpb-ne)"/><text class="bp-nl" x="296" y="80">Talimat</text><rect class="bp-task" x="180" y="216" width="124" height="50" rx="9"/><text class="bp-tx" text-anchor="middle"><tspan x="242" y="231">Müşteri verisini</tspan><tspan x="242" y="245">ekle: yalnız</tspan><tspan x="242" y="259">gerekli alanlar</tspan></text><polyline class="bp-sf" points="242,148 242,216" marker-end="url(#bpb-sf)"/><rect class="bp-task" x="180" y="334" width="124" height="50" rx="9"/><text class="bp-tx" text-anchor="middle"><tspan x="242" y="356">POST /teklifler:</tspan><tspan x="242" y="370">şemayı doğrula, ilet</tspan></text><polyline class="bp-sf" points="242,266 242,334" marker-end="url(#bpb-sf)"/><rect class="bp-task" x="180" y="472" width="124" height="50" rx="9"/><text class="bp-tx" text-anchor="middle"><tspan x="242" y="501">Teklifi hesapla</tspan></text><polyline class="bp-mf" points="224,384 224,472" marker-start="url(#bpb-ms)" marker-end="url(#bpb-me)"/><polyline class="bp-mf" points="260,472 260,384" marker-start="url(#bpb-ms)" marker-end="url(#bpb-me)"/><path class="bp-gw" d="M346 341 L364 359 L346 377 L328 359 Z"/><path class="bp-g